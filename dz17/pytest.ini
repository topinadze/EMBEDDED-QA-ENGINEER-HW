[pytest]
minversion = 8.0
pythonpath = .
addopts = -v --tb=short --alluredir=allure-results -m "not interactive and not ota and not persistent"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO

markers =
    lamp: SENTRY SWM-2 Beacon / Smart Lamp functional and visual checks
    wifi: SENTRY SWM-2 Wi-Fi antenna-buoy status, connection, and scan checks
    buttons: Operator panel buttons K1-K4 tap, hold, and pair transitions
    distance: HC-SR04 Active Sonar distance measurement, averaging, stream, and stats
    relay: Valve relay state, pulse, schedule, automatic-control, and health checks; actuations affect persistent state
    guard: SENTRY Guard perimeter monitoring tests; some cases actuate relay or change persistent zone state
    alert: CIC Alert Center generation, acknowledgement, and critical-effect tests
    alert_cleanup: explicitly acknowledges all pending alerts and deletes the full Alert Center history
    ota: Over-the-air firmware updates, channels, version validation, and rollback
    auth: Operator account registration, login, logout, whoami, passwd, and sudo access control
    auth_registration: first-time AU-1 registration validation with operator-confirmed NVS erase
    persistent: checks that alter or verify persistent device state; explicitly opt in
    interactive: physical checks that require a human observation and console input
    long_range: physical sonar checks requiring more than 4 m of clear target distance
    positive: positive functional checks
    negative: negative functional checks
    smoke: essential smoke checks
