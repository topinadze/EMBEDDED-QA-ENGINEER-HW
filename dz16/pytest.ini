[pytest]
minversion = 8.0
addopts = -v --tb=short --alluredir=allure-results -m "not interactive"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO

markers =
    lamp: Smart Lamp functional checks
    wifi: Wi-Fi status and button checks
    persistent: modifies saved lamp settings or scene data; review test effects before running
    positive: positive functional checks
    negative: negative functional checks
    smoke: essential smoke checks
    interactive: physical checks that require a human observation and console input
