[pytest]
minversion = 8.0
pythonpath = .
addopts = -v --tb=short --alluredir=allure-results -m "not interactive and not ota and not persistent"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO

markers =
    lamp: Smart Lamp functional checks
    wifi: Wi-Fi status and button checks
    system: system diagnostics, sensors, relay, and peripheral checks
    persistent: changes firmware or persistent device data; review effects before running
    ota: OTA checks; may interrupt Wi-Fi, reboot, or replace firmware
    positive: positive functional checks
    negative: negative functional checks
    smoke: essential smoke checks
    interactive: physical checks that require a human observation and console input
